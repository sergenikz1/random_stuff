name: Android Reader APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'android-reader/**'
      - '.github/workflows/android-reader.yml'
  pull_request:
    paths:
      - 'android-reader/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: |
            android-reader/app/libs
            android-reader/app/src/main/assets/tts
          key: tts-assets-${{ hashFiles('android-reader/app/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chitalka-vsluh-arm64
          path: android-reader/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0
