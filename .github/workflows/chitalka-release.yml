name: Читалка вслух — релиз APK

# Релиз собирается по тегу вида chitalka-v1.0 и публикуется в Releases
# вместе с обоими APK. Модели синтеза речи подтягиваются задачей fetchTtsAssets.
on:
  push:
    tags:
      - 'chitalka-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например chitalka-v1.0'
        required: true
        default: 'chitalka-v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: |
            android-reader/app/libs
            android-reader/app/src/main/assets/tts
          key: tts-assets-${{ hashFiles('android-reader/app/build.gradle.kts') }}

      - name: Build APKs
        working-directory: android-reader
        run: ./gradlew :app:assembleDebug

      - name: Собрать файлы релиза
        id: files
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#chitalka-v}"
          mkdir -p release
          cp android-reader/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             "release/chitalka-vsluh-$VERSION-arm64-v8a.apk"
          cp android-reader/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             "release/chitalka-vsluh-$VERSION-armeabi-v7a.apk"
          ls -la release
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.files.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
          else
            gh release create "$TAG" release/*.apk \
              --title "Читалка вслух $TAG" \
              --notes-file .github/release-notes-chitalka.md
          fi
