name: Читалка вслух — релиз APK

# Релиз собирается при изменении chitalka-vsluh/ в main или по тегу вида chitalka-v1.0
# и публикуется в Releases вместе с обоими APK. Модели синтеза речи подтягиваются задачей fetchTtsAssets.
on:
  push:
    branches:
      - main
    paths:
      - 'chitalka-vsluh/**'
      - '.github/workflows/chitalka-vsluh-release.yml'
    tags:
      - 'chitalka-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHITALKA_KEYSTORE_BASE64: ${{ secrets.CHITALKA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Пакет «tools» из набора по умолчанию убран из SDK, без этого sdkmanager падает.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: |
            chitalka-vsluh/app/libs
            chitalka-vsluh/app/src/main/assets/tts
          key: tts-assets-${{ hashFiles('chitalka-vsluh/app/build.gradle.kts') }}

      - name: Verify release tag matches app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' chitalka-vsluh/app/build.gradle.kts | head -1)
          test "$RELEASE_TAG" = "chitalka-v$VERSION"

      - name: Restore permanent signing key
        if: env.CHITALKA_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$CHITALKA_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Test and build APKs
        working-directory: chitalka-vsluh
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Explain manual publication when signing secret is missing
        if: env.CHITALKA_KEYSTORE_BASE64 == ''
        run: echo '::notice::Automatic publication requires CHITALKA_KEYSTORE_BASE64. Test APKs use a temporary key. Publish locally signed APKs manually until the permanent secret is configured.'

      - name: Собрать файлы релиза
        id: files
        run: |
          # Пуш тега задаёт имя релиза сам, для обычного пуша берём versionName из сборки.
          case "${{ github.ref_type }}" in
            tag) TAG="${{ github.ref_name }}" ;;
            *)   TAG="chitalka-v$(grep -m1 versionName chitalka-vsluh/app/build.gradle.kts | cut -d'"' -f2)" ;;
          esac
          VERSION="${TAG#chitalka-v}"
          mkdir -p release
          cp chitalka-vsluh/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             "release/chitalka-vsluh-$VERSION-arm64-v8a.apk"
          cp chitalka-vsluh/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             "release/chitalka-vsluh-$VERSION-armeabi-v7a.apk"
          ls -la release
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Опубликовать релиз
        if: env.CHITALKA_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.files.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published APKs are immutable."
          else
            gh release create "$TAG" release/*.apk \
              --target "$GITHUB_SHA" --latest=false \
              --title "Читалка вслух $TAG" \
              --notes-file chitalka-vsluh/RELEASE_NOTES.md
          fi
