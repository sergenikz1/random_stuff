name: Читалка вслух — релиз APK

# Релиз собирается при изменении chitalka-vsluh/ в main или по тегу вида chitalka-v1.0
# и публикуется в Releases вместе с обоими APK. Модели синтеза речи подтягиваются задачей fetchTtsAssets.
on:
  push:
    branches:
      - main
    paths:
      - 'chitalka-vsluh/**'
      - '.github/workflows/chitalka-vsluh-release.yml'
    tags:
      - 'chitalka-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Пакет «tools» из набора по умолчанию убран из SDK, без этого sdkmanager падает.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: |
            chitalka-vsluh/app/libs
            chitalka-vsluh/app/src/main/assets/tts
          key: tts-assets-${{ hashFiles('chitalka-vsluh/app/build.gradle.kts') }}

      - name: Build APKs
        working-directory: chitalka-vsluh
        run: ./gradlew :app:assembleDebug

      - name: Собрать файлы релиза
        id: files
        run: |
          # Пуш тега задаёт имя релиза сам, для обычного пуша берём versionName из сборки.
          case "${{ github.ref_type }}" in
            tag) TAG="${{ github.ref_name }}" ;;
            *)   TAG="chitalka-v$(grep -m1 versionName chitalka-vsluh/app/build.gradle.kts | cut -d'"' -f2)" ;;
          esac
          VERSION="${TAG#chitalka-v}"
          mkdir -p release
          cp chitalka-vsluh/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             "release/chitalka-vsluh-$VERSION-arm64-v8a.apk"
          cp chitalka-vsluh/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
             "release/chitalka-vsluh-$VERSION-armeabi-v7a.apk"
          ls -la release
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.files.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
          else
            gh release create "$TAG" release/*.apk \
              --target "$GITHUB_SHA" \
              --title "Читалка вслух $TAG" \
              --notes-file chitalka-vsluh/RELEASE_NOTES.md
          fi
