name: Читалка вслух — сборка APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'chitalka-vsluh/**'
      - '.github/workflows/chitalka-vsluh.yml'
  pull_request:
    paths:
      - 'chitalka-vsluh/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chitalka-vsluh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Пакет «tools» из набора по умолчанию убран из SDK, без этого sdkmanager падает.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: |
            chitalka-vsluh/app/libs
            chitalka-vsluh/app/src/main/assets/tts
          key: tts-assets-${{ hashFiles('chitalka-vsluh/app/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chitalka-vsluh-arm64
          path: chitalka-vsluh/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0
