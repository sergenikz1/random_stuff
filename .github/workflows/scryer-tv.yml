name: Scryer TV — сборка APK

on:
  push:
    paths:
      - "scryer-tv/**"
      - ".github/workflows/scryer-tv.yml"
  pull_request:
    paths:
      - "scryer-tv/**"
      - ".github/workflows/scryer-tv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SCRYERTV_KEYSTORE_BASE64: ${{ secrets.SCRYERTV_KEYSTORE_BASE64 }}
      SCRYERTV_KEYSTORE_PASSWORD: ${{ secrets.SCRYERTV_KEYSTORE_PASSWORD }}
      SCRYERTV_KEY_ALIAS: ${{ secrets.SCRYERTV_KEY_ALIAS }}
      SCRYERTV_KEY_PASSWORD: ${{ secrets.SCRYERTV_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.SCRYERTV_KEYSTORE_BASE64 != ''
        run: |
          echo "$SCRYERTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCRYERTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: scryer-tv
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        working-directory: scryer-tv
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ScryerTV-$(git rev-parse --short HEAD).apk"
          ls -la out

      # Квота на артефакты в аккаунте может быть исчерпана — это не повод
      # валить сборку: APK в таком случае берётся из релиза scryer-tv-latest.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ScryerTV-apk
          path: scryer-tv/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Push в main и ручной запуск из main обновляют предрелиз scryer-tv-latest свежим APK.
      - name: Publish APK to scryer-tv-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view scryer-tv-latest >/dev/null 2>&1 || gh release create scryer-tv-latest \
            --title "Scryer TV APK" \
            --notes "Автосборка клиента Scryer для Android TV. Обновляется при каждом изменении scryer-tv/ в main." \
            --prerelease
          # В плавающем релизе держим один, свежий APK.
          gh release view scryer-tv-latest --json assets --jq '.assets[].name' |
            while read -r name; do gh release delete-asset scryer-tv-latest "$name" --yes; done
          gh release upload scryer-tv-latest scryer-tv/out/*.apk --clobber
