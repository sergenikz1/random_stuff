name: Scryer TV — сборка APK

on:
  push:
    branches: ["**"]
    tags: ["scryer-tv-v*"]
    paths: ["scryer-tv/**", ".github/workflows/scryer-tv.yml"]
  pull_request:
    paths: ["scryer-tv/**", ".github/workflows/scryer-tv.yml"]
  workflow_dispatch:
    inputs:
      signed_apk_commit:
        description: Commit containing a pre-signed ScryerTV.apk (never a signing key)
        required: false
        type: string
      signed_apk_sha256:
        description: SHA-256 of the pre-signed APK
        required: false
        type: string
      release_tag:
        description: Optional scryer-tv-v<version> tag to publish
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCRYERTV_KEYSTORE_BASE64: ${{ secrets.SCRYERTV_KEYSTORE_BASE64 }}
      SCRYERTV_KEYSTORE_PASSWORD: ${{ secrets.SCRYERTV_KEYSTORE_PASSWORD }}
      SCRYERTV_KEY_ALIAS: ${{ secrets.SCRYERTV_KEY_ALIAS }}
      SCRYERTV_KEY_PASSWORD: ${{ secrets.SCRYERTV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode permanent release keystore
        if: env.SCRYERTV_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SCRYERTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "SCRYERTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build APK
        working-directory: scryer-tv
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
      - name: Prepare verified update APK
        if: env.SCRYERTV_KEYSTORE_FILE != '' || inputs.signed_apk_commit != ''
        env:
          SIGNED_APK_COMMIT: ${{ inputs.signed_apk_commit }}
          SIGNED_APK_SHA256: ${{ inputs.signed_apk_sha256 }}
        run: |
          mkdir -p scryer-tv/out
          version=$(python3 -c 'import pathlib,re; print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", pathlib.Path("scryer-tv/app/build.gradle.kts").read_text())[1])')
          apk="scryer-tv/out/ScryerTV-$version.apk"
          if [ -n "$SIGNED_APK_COMMIT" ]; then
            [[ "$SIGNED_APK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$SIGNED_APK_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
            git fetch --depth=1 origin "$SIGNED_APK_COMMIT"
            git show "$SIGNED_APK_COMMIT:ScryerTV.apk" > "$apk"
            printf '%s  %s\n' "$SIGNED_APK_SHA256" "$apk" | sha256sum --check
          else
            cp scryer-tv/app/build/outputs/apk/release/app-release.apk "$apk"
          fi
          python3 scryer-tv/scripts/create-update-manifest.py --apk "$apk" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --output scryer-tv/out/scryer-tv-update.json
          (cd scryer-tv/out && sha256sum *.apk scryer-tv-update.json > SHA256SUMS.txt)
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ScryerTV-build
          path: |
            scryer-tv/out/*
            scryer-tv/app/build/outputs/apk/release/*.apk
            scryer-tv/app/build/test-results/
          retention-days: 30
      - name: Explain unsigned build
        if: env.SCRYERTV_KEYSTORE_FILE == '' && inputs.signed_apk_commit == ''
        run: echo '::notice::Release APK is unsigned. Publishing requires the permanent signing key or a verified pre-signed APK. Random debug signing is disabled.'
      - name: Publish verified update
        if: (env.SCRYERTV_KEYSTORE_FILE != '' || inputs.signed_apk_commit != '') && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/scryer-tv-v') || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            release_tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            release_tag=scryer-tv-latest
          else
            release_tag="$REF_TAG"
          fi
          export SCRYERTV_RELEASE_TAG="$release_tag"
          python3 - <<'PY'
          import json, os, re
          tag = os.environ['SCRYERTV_RELEASE_TAG']
          with open('scryer-tv/out/scryer-tv-update.json') as stream:
              version = json.load(stream)['versionName']
          if tag != 'scryer-tv-latest' and not re.fullmatch('scryer-tv-v' + re.escape(version) + r'(?:-[A-Za-z0-9.]+)?', tag):
              raise SystemExit('Release tag must match the verified APK version')
          PY
          gh release view "$release_tag" >/dev/null 2>&1 || gh release create "$release_tag" \
            --target "$GITHUB_SHA" --title "Scryer TV — $release_tag" \
            --notes-file .github/release-notes-scryer-tv.md --prerelease --latest=false
          gh release upload "$release_tag" scryer-tv/out/*.apk scryer-tv/out/SHA256SUMS.txt --clobber
          # Upload metadata last, after the corresponding APK is available.
          gh release upload "$release_tag" scryer-tv/out/scryer-tv-update.json --clobber
