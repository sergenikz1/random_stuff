<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; media-src 'self' blob:;" />
<title>FlowVoice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    cursor: default;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px;
  }
  #pill {
    display: flex; align-items: center; gap: 14px;
    min-width: 208px; max-width: 316px;
    padding: 13px 20px;
    border-radius: 999px;
    background: rgba(16, 16, 24, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.11);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(129, 90, 250, 0.06);
    backdrop-filter: blur(22px) saturate(140%);
    color: #f4f4f8;
    transform: translateY(14px) scale(0.96);
    opacity: 0;
    transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .18s ease, border-color .2s ease;
  }
  #pill.in { transform: translateY(0) scale(1); opacity: 1; }
  #pill.error { border-color: rgba(248, 113, 113, 0.55); }
  #pill.done  { border-color: rgba(52, 211, 153, 0.45); }

  #dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #f43f5e; flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(244, 63, 94, .6);
    animation: pulse 1.35s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(244,63,94,.55); }
    70%  { box-shadow: 0 0 0 9px rgba(244,63,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); }
  }
  #dot.working { background: #a78bfa; animation: spinpulse 1s linear infinite; }
  @keyframes spinpulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  #dot.done  { background: #34d399; animation: none; box-shadow: none; }
  #dot.error { background: #f87171; animation: none; box-shadow: none; }

  #bars { display: flex; align-items: center; gap: 3px; height: 30px; flex: 1 1 auto; }
  #bars i {
    display: block; width: 3px; height: 4px; border-radius: 2px;
    background: linear-gradient(180deg, #c4b5fd, #8b5cf6);
    transition: height .07s linear;
  }
  #label {
    font-size: 12.5px; letter-spacing: .1px; line-height: 1.25;
    flex: 1 1 auto; display: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #label.show { display: block; }
  #bars.hide { display: none; }
  #hint {
    font-size: 10.5px; color: rgba(244,244,248,.45);
    flex: 0 0 auto; letter-spacing: .2px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="pill">
      <span id="dot"></span>
      <div id="bars"></div>
      <div id="label"></div>
      <span id="hint"></span>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
